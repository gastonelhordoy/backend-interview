<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Meeting Notes</title>
  <style>
    :root { --bg: #f5f5f4; --card: #ffffff; --text: #1c1917; --muted: #57534e; --border: #d6d3d1;
            --accent: #1d4ed8; --accent-text: #ffffff; --error-bg: #fef2f2; --error: #b91c1c; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1c1917; --card: #292524; --text: #f5f5f4; --muted: #a8a29e; --border: #44403c;
              --accent: #60a5fa; --accent-text: #0c0a09; --error-bg: #450a0a; --error: #fca5a5; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
           background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, sans-serif; }
    main { width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--border);
           border-radius: 12px; padding: 28px; }
    h1 { font-size: 1.25rem; margin: 0 0 4px; }
    p { margin: 0 0 20px; color: var(--muted); font-size: .9rem; }
    strong { color: var(--text); }
    label { display: block; font-size: .875rem; font-weight: 600; margin: 14px 0 6px; }
    input[type=email], input[type=password] { width: 100%; padding: 10px 12px; font: inherit; color: inherit;
           background: transparent; border: 1px solid var(--border); border-radius: 8px; }
    input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .error { background: var(--error-bg); color: var(--error); padding: 10px 12px; border-radius: 8px;
             font-size: .875rem; margin-bottom: 8px; }
    .actions { display: flex; gap: 8px; margin-top: 22px; }
    button { flex: 1; padding: 10px; font: inherit; font-weight: 600; border-radius: 8px; cursor: pointer;
             border: 1px solid var(--border); background: transparent; color: var(--text); }
    button[value=approve] { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
    .fine { margin: 18px 0 0; font-size: .8rem; }
  </style>
</head>
<body>
  <main>
    <h1>Sign in to Meeting Notes</h1>
    <p><strong>$client_name</strong> wants to use the Meeting Notes API on your behalf
       (meetings, notes and tasks you can access).</p>
    $error
    <form method="post" action="/oauth/authorize">
      $hidden_fields
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required autofocus value="$email">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <div class="actions">
        <button type="submit" name="action" value="deny" formnovalidate>Cancel</button>
        <button type="submit" name="action" value="approve">Authorize</button>
      </div>
    </form>
    <p class="fine">You will be sent back to <strong>$redirect_host</strong>.</p>
  </main>
</body>
</html>
